[project]
name = "llm-chatbot"
version = "2.0.0"
description = "Question answering over technical manuals in which every claim is checked against, and highlighted on, its source page"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    {name = "Alex8642"}
]

dependencies = [
    # server
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.3",
    "requests>=2.32.3",
    # retrieval: embedder, reranker, index
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.3.1",
    "transformers[sentencepiece]>=4.40.0",
    "accelerate>=1.12.0",
    "numpy>=1.26.4",
    # documents and matching
    "pymupdf>=1.24.10",
    "pillow>=10.0",
    "rapidfuzz>=3.0",
    # public benchmark (evals/vidore.py)
    "pandas==2.2.2",
    "pyarrow>=17.0.0",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.30.1",
    "jupyter>=1.0.0",
    "black>=24.2.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27",
]

# Parser candidates for the v2 spike (GPU, laptop). Conflicting stacks: install one at a time.
docling = [
    "docling[rapidocr]>=2.60",
    "rapidocr>=3.9.1,<3.10",  # docling 2.130 needs PP_OCRV6_LANGS, missing in 3.10.0
]
paddle = [
    "paddlepaddle-gpu>=3.2.1",
    "paddleocr[doc-parser]>=3.3",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[tool.uv]
conflicts = [[{ extra = "docling" }, { extra = "paddle" }]]

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "parsers: needs a GPU parser extra (docling or paddle); run with MANUALQA_PARSERS=1",
]
