name: Demo site

# The static replay demo on GitHub Pages: recorded answers, no server or model.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Build the interface in demo mode
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --mode demo --base=/${{ github.event.repository.name }}/
      - name: Add the recordings and the pages they show
        run: |
          uv run --no-project --with pymupdf --with pillow \
            python -m manualqa.static_demo docs/demo/replay.jsonl frontend/dist/demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
